# Local infrastructure: app + DynamoDB Local + LocalStack (SQS).
# Usage: docker-compose up --build   (see README). Defaults work without a .env file.
# Hardening (see docs/security.md): ports bound to 127.0.0.1 only, cap_drop ALL, no-new-privileges, read-only root
# filesystem where the image allows it, memory/cpu/pids limits, restart policy. Dummy credentials only.
services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "127.0.0.1:${DYNAMODB_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      # exec is required: DynamoDB Local extracts its SQLite native library to /tmp and mmaps it (tmpfs is noexec by default).
      - /tmp:rw,exec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      # Any HTTP response means the server is up (curl exits 0 without -f).
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  localstack:
    # Last release that runs without LOCALSTACK_AUTH_TOKEN (2026.x requires one).
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      ORDERS_QUEUE_NAME: ${ORDERS_QUEUE_NAME:-orders}
      ORDERS_DLQ_NAME: ${ORDERS_DLQ_NAME:-orders-dlq}
      ORDERS_MAX_RECEIVE_COUNT: ${ORDERS_MAX_RECEIVE_COUNT:-3}
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    # LocalStack runs as root and writes its state/cache under /var/lib/localstack and /tmp: both tmpfs, so the
    # root filesystem stays read-only and nothing persists (SQS state is disposable local data anyway).
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/localstack
      - /root/.cache
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 1024
    restart: unless-stopped
    volumes:
      - ./docker/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      # Healthy only once the ready.d init scripts (queue creation) have completed.
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q 'completed.: true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: ticketflow:local
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
      # Actuator (health probes, Prometheus metrics): own port, loopback only. Never publish it on 0.0.0.0.
      - "127.0.0.1:${MANAGEMENT_PORT:-8081}:8081"
    # The distroless image runs as non-root (uid 65532); the JVM only needs a writable /tmp (tmpfs).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    restart: unless-stopped
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      # AWS SDK v2 per-service endpoint overrides (service names resolve on the compose network).
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      AWS_ENDPOINT_URL_SQS: http://localstack:4566
      ORDERS_QUEUE_NAME: ${ORDERS_QUEUE_NAME:-orders}
      # SQS publisher settings (ticketflow.sqs.*); dummy LocalStack credentials only.
      TICKETFLOW_SQS_ENDPOINT: http://localstack:4566
      TICKETFLOW_SQS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      TICKETFLOW_SQS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      TICKETFLOW_SQS_REGION: ${AWS_REGION:-us-east-1}
      TICKETFLOW_SQS_ORDERS_QUEUE_NAME: ${ORDERS_QUEUE_NAME:-orders}
      # Order consumer (ProcessOrderUseCase): runs by default (DP-037), nothing to enable here. The queue has a
      # redrive policy to the DLQ (init-queues.sh). Set TICKETFLOW_SQS_CONSUMER_ENABLED=false only for an API-only role.
      # Secret for admin routes (X-Admin-Key). No default on purpose: unset/empty disables them (403).
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      # Reservation-expiration job (ReleaseExpiredReservationsUseCase): runs by default (DP-037), every minute.
      # Set TICKETFLOW_EXPIRATION_ENABLED=false only for an API-only role.
      # Observability (docs/observability.md): JSON logs with the correlation id, actuator on the management port
      # (listening on the container interface, published on 127.0.0.1 only, see ports), queue-depth gauges.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      TICKETFLOW_ENVIRONMENT: ${TICKETFLOW_ENVIRONMENT:-local}
      TICKETFLOW_OBSERVABILITY_QUEUE_METRICS_ENABLED: "true"
      # Create DynamoDB tables and GSIs at startup (idempotent).
      TICKETFLOW_DYNAMODB_PROVISIONING_ENABLED: "true"
      TICKETFLOW_DYNAMODB_ENDPOINT: http://dynamodb:8000
      TICKETFLOW_DYNAMODB_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      TICKETFLOW_DYNAMODB_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      TICKETFLOW_DYNAMODB_REGION: ${AWS_REGION:-us-east-1}
    depends_on:
      dynamodb:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      # The probe command comes from the image HEALTHCHECK (Java probe on the management port liveness endpoint;
      # the distroless image has no shell/curl).
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
