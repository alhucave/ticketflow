name: Release

# Publishes ghcr.io/alhucave/ticketflow when a semver tag is pushed (F-003, hardened in F-032, DP-029 and DP-040):
#   gate    -> the tagged commit is on main AND has a successful `verify` check run (otherwise nothing is published)
#   publish -> builds the image with the tag version baked in and pushes it (the only job with packages: write)
#   smoke   -> pulls the pushed image BY DIGEST, starts it with no infrastructure and checks liveness + version
# Tags: vX.Y.Z (stable: image tags X.Y.Z, X.Y and latest) or vX.Y.Z-<prerelease> (image tag X.Y.Z-<prerelease> only).
# The procedure to cut a release and to undo a bad one is in README.md ("Publicar un release").
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# Nothing is granted by default; every job lists exactly what it needs.
permissions: {}

# Two pushes of the same tag must never publish at the same time; a started release is never cancelled half way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Must be lowercase (registry rule); the owner is already lowercase.
  IMAGE_NAME: ghcr.io/alhucave/ticketflow

jobs:
  gate:
    name: Gate (tagged commit is on main and verify is green)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the tagged commit to be on main
        run: scripts/require-commit-on-main.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" main

      # Waits (up to 20 min) if the push CI of main is still running, then fails unless a `verify` run succeeded.
      - name: Require a successful verify check run
        run: scripts/require-green-verify.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"

  publish:
    name: Build and push the image
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.1.0 -> 0.1.0, 0.1, latest (the major alone is not generated while it is 0). `latest` comes from the action's
      # default flavor (latest=auto: only for a non-prerelease semver tag); do NOT add `type=raw,value=latest`: it
      # duplicates the tag and would also tag prereleases as latest. The labels include
      # org.opencontainers.image.source=https://github.com/<owner>/<repo>, which links the package to the repository.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # docker-container driver: needed for the provenance attestation that build-push-action adds by default.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # APP_VERSION becomes the version of the application (service.version of the logs), see the Dockerfile.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image published"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Reference by digest: \`${IMAGE_NAME}@${DIGEST}\`"
            echo "- Tags:"
            while IFS= read -r tag; do echo "  - \`${tag}\`"; done <<<"${TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed ${IMAGE_NAME}@${DIGEST}"

  smoke:
    name: Smoke test of the pushed digest
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The package is private while the repository is private: the pull needs a login.
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pulled by digest (not by tag): this is exactly the artifact the previous job pushed. No DynamoDB or SQS:
      # liveness must be 200 and the logs must report the tag version; readiness is DOWN by design.
      - name: Run the image and check liveness and version
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          IMAGE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          if [ -z "${IMAGE_DIGEST}" ] || [ -z "${IMAGE_VERSION}" ]; then
            echo "::error::The publish job did not report a digest and a version"
            exit 1
          fi
          scripts/smoke-image.sh "${IMAGE_NAME}@${IMAGE_DIGEST}" "${IMAGE_VERSION}" 90
