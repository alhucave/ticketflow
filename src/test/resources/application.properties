# Test contexts (many, cached, in one JVM) must never fight over the fixed management port of application.yml.
management.server.port=0
# Every WebTestClient injected by Spring Boot (@SpringBootTest with a server, @WebFluxTest) waits this long for a
# response instead of the 5 s default. Must equal TestTimeouts.RESPONSE (checked by TestTimeoutsTest); clients built by
# hand go through TestWebClients. Decision DP-035.
spring.test.webtestclient.timeout=60s
# The SQS consumer and the expiration job run BY DEFAULT in the application (DP-037), but a test context must not start
# them unless the test needs them: they would poll/sweep unreachable or unrelated infrastructure from every cached
# context. This is the ONE place that switches them off for the suite; a test that needs a component sets it to
# true explicitly (@DynamicPropertySource / properties), and RuntimeComponentsDefaultsTest proves the real defaults by
# loading the main application.yml only.
ticketflow.sqs.consumer.enabled=false
ticketflow.expiration.enabled=false
